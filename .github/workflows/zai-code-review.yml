name: GLM 5.2 PR Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review PR with GLM 5.2
    # A ZAI_REVIEW_RUNNER repository variable (e.g. truenas) moves the review
    # to self-hosted runners with that label; unset, GitHub hosts it.
    runs-on: ${{ vars.ZAI_REVIEW_RUNNER || 'ubuntu-latest' }}
    if: ${{ github.event.pull_request.draft == false }}
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - name: Z.ai Code Review
        if: ${{ env.ZAI_API_KEY != '' }}
        uses: L-K-M/zai-code-review@13a9ddba4ff2e2086dbd91af184f74dee6587c17
        with:
          ZAI_API_KEY: ${{ env.ZAI_API_KEY }}
          # Xiaomi MiMo reviews the chunks Z.ai still fails on (rate limits,
          # outages). An empty MIMO_API_KEY secret disables the fallback.
          FALLBACK_API_KEY: ${{ secrets.MIMO_API_KEY }}
          FALLBACK_API_URL: https://token-plan-sgp.xiaomimimo.com/v1/chat/completions
          FALLBACK_MODEL: mimo-v2.6-pro
          ZAI_MODEL: glm-5.2
          ZAI_MODEL_FAST: glm-5.3-flash
          ZAI_REVIEWER_NAME: GLM 5.2 Code Review
          GITHUB_TOKEN: ${{ github.token }}

      - name: Skip when Z.ai API key is unavailable
        if: ${{ env.ZAI_API_KEY == '' }}
        run: echo "Skipping Z.ai review because ZAI_API_KEY is not configured."