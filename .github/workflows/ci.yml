name: CI

# A `claude/**` branch with an open pull request builds *twice* per push —
# once for `push`, once for `pull_request` — and the two runs compile the same
# code, disagreeing only about whether the merge commit is included, which is
# exactly what the pull-request run is for. What that costs is no longer money
# (this repository is public, so Actions minutes and artifact storage are both
# free) but it is still two identical rows to read on every pull request and
# two macOS runners held for one answer. Push the branch, open the pull
# request — this repo's convention anyway — and the pull-request run is the
# build.
on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Sortomat.xcodeproj
  SCHEME: Sortomat

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    # A wedged xcodebuild otherwise burns the 6-hour default job limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'   # pin so a runner-image bump can't change the toolchain

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
          # An .xcresult bundle is tens of megabytes. Without a retention limit
          # these piled up until *new* uploads started failing — turning
          # "upload the evidence" into a second red step. A week is long enough
          # that a Friday-evening failure is still inspectable after a weekend,
          # and still 13x less storage than the 90-day default.
          retention-days: 7
