name: CI

# A `claude/**` branch with an open pull request used to build *twice* per
# push — once for `push`, once for `pull_request` — on macOS runners, which
# bill at ten times the Linux rate. That doubled the bill for no extra
# information: both runs compile the same code and disagree only about whether
# the merge commit is included, which is precisely what the pull-request run
# checks. Open the pull request when you push the branch (this repo's
# convention anyway) and the pull-request run *is* the build.
on:
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Sortomat.xcodeproj
  SCHEME: Sortomat

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    # A wedged xcodebuild otherwise burns the 6-hour default job limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'   # pin so a runner-image bump can't change the toolchain

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify

      # No artifact upload. An .xcresult bundle is tens of megabytes, they piled
      # up under the account-wide storage quota until *new* uploads started
      # failing — so the step meant to preserve the evidence became a second
      # red step on every red run, and the quota it was filling counts against
      # the same spending limit that pays for the runners. The failure text
      # `xcbeautify` prints in the log has been enough to diagnose every
      # failure this project has had; the bundle was never opened once.
