name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

# Cancel an in-progress run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Sortomat.xcodeproj
  SCHEME: Sortomat

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    # A wedged xcodebuild otherwise burns the 6-hour default job limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'   # pin so a runner-image bump can't change the toolchain

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
          # An .xcresult bundle is tens of megabytes. Without a retention limit
          # these piled up under the account-wide storage quota until *new*
          # uploads started failing — turning "upload the evidence" into a
          # second red step. A week is long enough that a Friday-evening
          # failure is still inspectable after a weekend, and still 13x less
          # storage than the 90-day default.
          retention-days: 7
